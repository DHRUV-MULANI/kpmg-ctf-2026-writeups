<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="KPMG CTF 2026 Campus Edition writeups and evidence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c2ff"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff4d8d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="70" y="92" fill="#8ea3c8" font-size="20" letter-spacing="6">KPMG CTF 2026 · CAMPUS EDITION</text>
    <text x="70" y="164" fill="#ffffff" font-size="58" font-weight="700">Writeups &amp; Evidence Vault</text>
    <text x="70" y="212" fill="#a9b8d4" font-size="22">Web · API · Infra · Crypto · Forensics · IR · OSINT · IoT · Mobile · RE</text>

    <g transform="translate(70, 250)">
      <rect x="0" y="0" width="196" height="40" rx="20" fill="#00c2ff" fill-opacity="0.12" stroke="#00c2ff" stroke-opacity="0.55"/>
      <text x="24" y="26" fill="#7fe3ff" font-size="18" font-weight="600">610 / 680 points</text>

      <rect x="212" y="0" width="196" height="40" rx="20" fill="#7c5cff" fill-opacity="0.12" stroke="#7c5cff" stroke-opacity="0.55"/>
      <text x="236" y="26" fill="#c7b8ff" font-size="18" font-weight="600">33 walkthroughs</text>

      <rect x="424" y="0" width="214" height="40" rx="20" fill="#ff4d8d" fill-opacity="0.12" stroke="#ff4d8d" stroke-opacity="0.55"/>
      <text x="448" y="26" fill="#ff9fc1" font-size="18" font-weight="600">31 flags captured</text>

      <text x="690" y="26" fill="#6f80a3" font-size="18">9 October 2026 · Dhruv Mulani</text>
    </g>
  </g>
</svg>
